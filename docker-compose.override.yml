# BitfinexBot 集成部署配置
# 用于集成到现有 Docker 环境中

services:
  # BitfinexBot 服务（使用现有网络）
  bitfinex-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bitfinex_bot
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default
    environment:
      - CONFIG_PATH=/app/config.yaml
    command: ["./bitfinex-bot", "-c", "/app/config.yaml"]

  # BitfinexBot Web 管理界面（集成到现有nginx）
  bitfinex-web:
    image: nginx:alpine
    container_name: bitfinex_web
    restart: unless-stopped
    ports:
      - "8082:80"  # 使用8082避免端口冲突
    volumes:
      - ./web:/var/www/html/bitfinex
      - ./docker/nginx-bitfinex.conf:/etc/nginx/conf.d/bitfinex.conf
    depends_on:
      - bitfinex-bot
    networks:
      - default

networks:
  default:
    external: true