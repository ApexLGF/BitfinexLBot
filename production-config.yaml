# BitfinexBot 生产环境配置文件
# 请根据实际情况修改相关参数

# Bitfinex API 配置
bitfinex:
  api_key: "YOUR_BITFINEX_API_KEY"      # 替换为你的Bitfinex API Key
  secret_key: "YOUR_BITFINEX_SECRET"    # 替换为你的Bitfinex Secret Key
  funding_symbol: "fUSD"                # 资金符号
  base_url: "https://api.bitfinex.com"  # Bitfinex API 基础URL

# 数据库配置 - 适配生产环境
database:
  dsn: "bitfinex_bot:BitfinexBot@2025@tcp(mysql:3306)/bitfinex_bot_db?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_conns: 25
  max_idle_conns: 25
  conn_max_lifetime: 5 # 分钟

# 策略配置
strategy:
  # 基本放贷参数
  min_daily_lend_rate: 0.0001          # 最低可接受日利率 (0.01%)
  max_daily_lend_rate: 0.1             # 最高可接受日利率 (10%)
  order_limit: 10                      # 每次执行的最大订单数
  spread_lend: 5                       # 分散订单数量
  
  # 利率计算参数
  gap_bottom: 2000                     # 资金簿底部间隙
  gap_top: 5000                        # 资金簿顶部间隙
  
  # 高额持有策略
  high_hold_enabled: true              # 启用高额持有策略
  high_hold_amount: 1000              # 高额持有金额阈值
  high_hold_rate: 0.001               # 高额持有利率 (0.1%)
  high_hold_period: 30                # 高额持有期间（天）
  
  # 期间选择阈值
  rate_2day_threshold: 0.0005         # 2天期利率阈值
  rate_30day_threshold: 0.002         # 30天期利率阈值
  rate_120day_threshold: 0.005        # 120天期利率阈值

# 智能策略配置
smart_strategy:
  enabled: true                        # 启用智能策略
  market_analysis_enabled: true       # 启用市场分析
  competitive_analysis_enabled: true  # 启用竞争分析
  
  # 市场趋势分析参数
  trend_period: 24                    # 趋势分析周期（小时）
  volatility_threshold: 0.1          # 波动率阈值
  
  # 动态调整参数
  rate_adjustment_factor: 1.05        # 利率调整因子
  amount_distribution_ratio: 0.7      # 资金分配比例

# 执行配置
execution:
  test_mode: false                    # 生产环境设为 false
  request_interval: 30                # API请求间隔（秒）
  execution_interval: 300             # 策略执行间隔（秒，5分钟）
  max_concurrent_orders: 20           # 最大并发订单数

# Telegram 机器人配置（可选）
telegram:
  enabled: false                      # 如需要请设为 true 并配置以下参数
  bot_token: "YOUR_TELEGRAM_BOT_TOKEN"
  chat_id: 0                         # 你的Telegram Chat ID
  notification_interval: 3600        # 通知间隔（秒，1小时）

# 日志配置
logging:
  level: "info"                      # 日志级别: debug, info, warn, error
  file_path: "/app/logs/bitfinex-bot.log"
  max_size_mb: 100                   # 日志文件最大大小（MB）
  max_backups: 7                     # 保留的日志文件数量
  max_age_days: 30                   # 日志文件保留天数
  compress: true                     # 压缩旧日志文件

# 监控配置
monitoring:
  health_check_port: 8080            # 健康检查端口
  metrics_enabled: true              # 启用指标收集
  performance_monitoring: true       # 启用性能监控
  
# 安全配置
security:
  rate_limit_enabled: true           # 启用API速率限制
  request_timeout: 30                # 请求超时时间（秒）
  max_retries: 3                     # 最大重试次数
  retry_delay: 5                     # 重试延迟（秒）

# 应用配置
app:
  name: "BitfinexBot"
  version: "2.0.0"
  environment: "production"          # 环境标识
  timezone: "Asia/Shanghai"          # 时区设置