# 📋 BitfinexBot 生产环境配置文件
# 请根据实际情况修改相关参数

# 🔑 API 設定
BITFINEX_API_KEY: "YOUR_BITFINEX_API_KEY"        # 替换为你的Bitfinex API Key
BITFINEX_SECRET_KEY: "YOUR_BITFINEX_SECRET_KEY"  # 替换为你的Bitfinex Secret Key

# ⚙️ 基本設定
CURRENCY: "USD"                       # 交易幣種 (USD, BTC, ETH...)
MINUTES_RUN: 30                       # 主要任務執行間隔 (分鐘)
ORDER_LIMIT: 10                       # 單次最大下單數量
MIN_LOAN: 50                          # 最小貸出金額
MAX_LOAN: 5000                        # 最大貸出金額

# 📈 利率策略設定
MIN_DAILY_LEND_RATE: 0.0001          # 最低日利率 (生产环境建议)
SPREAD_LEND: 20                       # 資金分散筆數
GAP_BOTTOM: 10                        # 訂單深度下限
GAP_TOP: 5000                         # 訂單深度上限
THIRTY_DAY_LEND_RATE_THRESHOLD: 0.002   # 30天期閾值
ONE_TWENTY_DAY_LEND_RATE_THRESHOLD: 0.005  # 120天期閾值
RATE_BONUS: 0.0001                    # 無掛單時利率加成

# 💎 高額持有策略
HIGH_HOLD_RATE: 0.005                # 高額持有利率 (生产环境建议)
HIGH_HOLD_AMOUNT: 1000               # 高額持有金額 (0=停用)
HIGH_HOLD_ORDERS: 1                  # 高額持有訂單數

# K線策略設定
ENABLE_KLINE_STRATEGY: false         # 啟用K線策略
KLINE_TIME_FRAME: "15m"              # K線時間框架：15分鐘
KLINE_PERIOD: 24                     # K線週期數量：24個15分鐘K線（6小時）
KLINE_SPREAD_PERCENT: 5.0            # K線最高點加成百分比：5%

# 🧠 智能策略設定
ENABLE_SMART_STRATEGY: true          # 啟用智能策略
VOLATILITY_THRESHOLD: 0.002          # 市場波動閾值
MAX_RATE_MULTIPLIER: 2.0             # 最大利率倍數
MIN_RATE_MULTIPLIER: 0.8             # 最小利率倍數
RATE_RANGE_INCREASE_PERCENT: 0.04    # 利率範圍增加百分比

# 📱 通知設定
NOTIFY_RATE_THRESHOLD: 0.05          # 利率通知閾值
LENDING_CHECK_MINUTES: 30            # 借貸檢查間隔 (分鐘)

# 🛡️ 其他設定
TEST_MODE: false                     # 生產環境設為 false (重要!)
RESERVE_AMOUNT: 0                    # 保留金額

# 🗄️ 數據庫配置 - 適配生產環境
database:
  host: "mysql"                      # 數據庫主機 (Docker 容器名)
  port: 3306                         # 數據庫端口
  username: "bitfinex_bot"           # 數據庫用戶名
  password: "BitfinexBot@2025"       # 數據庫密碼
  database: "bitfinex_bot_db"        # 數據庫名
  charset: "utf8mb4"                 # 字符集
  max_open_conns: 25                 # 最大開放連接數
  max_idle_conns: 15                 # 最大空閒連接數
  conn_max_lifetime: "2h"            # 連接最大生存時間