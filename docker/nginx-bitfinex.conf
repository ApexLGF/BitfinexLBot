# BitfinexBot Web 管理界面配置
# 集成到现有 nginx 服务中

server {
    listen 80;
    server_name bitfinex.local;
    
    # 根目录指向 BitfinexBot web 界面
    root /var/www/html/bitfinex;
    index index.html index.php;
    
    # 路由配置
    location /bitfinex/ {
        alias /var/www/html/bitfinex/;
        try_files $uri $uri/ /index.html;
    }
    
    # API 路由
    location /bitfinex/api/ {
        alias /var/www/html/bitfinex/api/;
        try_files $uri $uri/ =404;
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php-fpm:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/html/bitfinex/api/$fastcgi_script_name;
        }
    }
    
    # 静态资源
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # 日志配置
    access_log /var/log/nginx/bitfinex.access.log;
    error_log /var/log/nginx/bitfinex.error.log;
}