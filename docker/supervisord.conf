[supervisord]
nodaemon=true
loglevel=info
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Nginx 服务
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log
user=root
priority=100

# BitfinexBot 应用程序
[program:bitfinex-bot]
command=/app/bitfinex-bot -c /app/config.yaml
directory=/app
autostart=true
autorestart=true
stderr_logfile=/app/logs/bitfinex-bot.err.log
stdout_logfile=/app/logs/bitfinex-bot.out.log
user=root
priority=200
environment=TZ="Asia/Shanghai"

# 重启策略：如果程序异常退出，自动重启
startsecs=5
startretries=3
exitcodes=0