# BitfinexBot 现有环境配置
# 适配已有 Docker 环境的配置文件

# 🔑 API 设定 (保持原有配置)
BITFINEX_API_KEY: "your_api_key_here"
BITFINEX_SECRET_KEY: "your_secret_key_here"

# ⚙️ 基本设定
CURRENCY: "USD"
MINUTES_RUN: 30
ORDER_LIMIT: 20
MIN_LOAN: 2000
MAX_LOAN: 5000

# 📈 利率策略设定
MIN_DAILY_LEND_RATE: 0.028
SPREAD_LEND: 30
GAP_BOTTOM: 10
GAP_TOP: 5000
THIRTY_DAY_LEND_RATE_THRESHOLD: 0.028
ONE_TWENTY_DAY_LEND_RATE_THRESHOLD: 0.036
RATE_BONUS: 0.001

# 💎 高额持有策略
HIGH_HOLD_RATE: 0.1
HIGH_HOLD_AMOUNT: 155
HIGH_HOLD_ORDERS: 1

# 🧠 智能策略设定
ENABLE_SMART_STRATEGY: true
VOLATILITY_THRESHOLD: 0.002
MAX_RATE_MULTIPLIER: 2.0
MIN_RATE_MULTIPLIER: 0.8
RATE_RANGE_INCREASE_PERCENT: 0.04

# 📱 通知设定
NOTIFY_RATE_THRESHOLD: 0.1
LENDING_CHECK_MINUTES: 30

# 🛡️ 其他设定
TEST_MODE: false
RESERVE_AMOUNT: 0

# 🗄️ 数据库配置 (适配现有 MySQL)
database:
  host: "mysql"  # 使用现有 MySQL 服务名
  port: 3306
  username: "appuser"  # 使用现有 MySQL 用户
  password: "apppass"  # 使用现有 MySQL 密码
  database: "appdb"    # 使用现有 MySQL 数据库
  charset: "utf8mb4"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: "1h"