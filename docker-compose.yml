services:
  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: bitfinexbot_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: bitfinex_bot_db
      MYSQL_USER: bitfinex_bot
      MYSQL_PASSWORD: BitfinexBot@2025
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/mysql.cnf:/etc/mysql/conf.d/custom.cnf
    networks:
      - bitfinex_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "bitfinex_bot", "-pBitfinexBot@2025"]
      timeout: 20s
      retries: 10

  # PHP-FPM + Nginx Web 服务
  web:
    image: nginx:alpine
    container_name: bitfinexbot_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./web:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - mysql
    networks:
      - bitfinex_network

  # PHP-FPM 服务
  php:
    image: php:8.1-fpm-alpine
    container_name: bitfinexbot_php
    restart: unless-stopped
    volumes:
      - ./web:/var/www/html
    networks:
      - bitfinex_network
    depends_on:
      mysql:
        condition: service_healthy
    # 安装必要的 PHP 扩展
    command: >
      sh -c "apk add --no-cache mysql-dev &&
             docker-php-ext-install mysqli pdo pdo_mysql &&
             php-fpm"

  # BitfinexBot Go 应用
  bitfinex-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bitfinexbot_app
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bitfinex_network
    environment:
      - CONFIG_PATH=/app/config.yaml
    # 启动BitfinexBot应用
    command: ["./bitfinex-bot", "-c", "/app/config.yaml"]

  # phpMyAdmin (可选，便于数据库管理)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: bitfinex_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: bitfinex_bot
      PMA_PASSWORD: BitfinexBot@2025
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bitfinex_network

volumes:
  mysql_data:
    driver: local

networks:
  bitfinex_network:
    driver: bridge