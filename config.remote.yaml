# BitfinexBot 配置文件 - 远程部署环境
# 版本: v2.3.2

# Bitfinex API 凭证
BITFINEX_API_KEY: "your_api_key_here"  # 请替换为完整的 API Key
BITFINEX_SECRET_KEY: "your_secret_key_here"  # 请替换为完整的 Secret Key

# 全局配置
ORDER_LIMIT: 30 # 每次掛單只掛幾筆，避免一次掛太多都成立，錯過大利率
MINUTES_RUN: 5 # 每隔幾分鐘執行一次

# 多币种配置
CURRENCIES:
  USD:
    ENABLED: true
    MIN_LOAN: 1000 # 每筆最小金額
    MAX_LOAN: 0 # 每筆最大金額，0表示不限制
    MIN_DAILY_LEND_RATE: 0.032 # 最小利率
    SPREAD_LEND: 50 # 資金分配幾份
    GAP_BOTTOM: 10 # 參數是指ask掛單裡面第幾個index 下限
    GAP_TOP: 5000 # 參數是指ask掛單裡面第幾個index 上限
    THIRTY_DAY_LEND_RATE_THRESHOLD: 0.028 # 超過多少就掛30天的單
    ONE_TWENTY_DAY_LEND_RATE_THRESHOLD: 0.032 # 超過多少就掛120天的單
    HIGH_HOLD_RATE: 0.04
    HIGH_HOLD_AMOUNT: 2000
    HIGH_HOLD_ORDERS: 1
    RATE_BONUS: 0.002 # 當下次執行時沒有未成功訂單時就加利率
    NOTIFY_RATE_THRESHOLD: 0.05
    RESERVE_AMOUNT: 0

  UST:
    ENABLED: true
    MIN_LOAN: 1000
    MAX_LOAN: 0
    MIN_DAILY_LEND_RATE: 0.03
    SPREAD_LEND: 30
    GAP_BOTTOM: 10
    GAP_TOP: 5000
    THIRTY_DAY_LEND_RATE_THRESHOLD: 0.028
    ONE_TWENTY_DAY_LEND_RATE_THRESHOLD: 0.032
    HIGH_HOLD_RATE: 0.04
    HIGH_HOLD_AMOUNT: 2000
    HIGH_HOLD_ORDERS: 1
    RATE_BONUS: 0.002
    NOTIFY_RATE_THRESHOLD: 0.05
    RESERVE_AMOUNT: 0

# 智能策略配置（全局）
ENABLE_SMART_STRATEGY: true
VOLATILITY_THRESHOLD: 0.002
MAX_RATE_MULTIPLIER: 1.3
MIN_RATE_MULTIPLIER: 0.7
RATE_RANGE_INCREASE_PERCENT: 0.05

LENDING_CHECK_MINUTES: 5

# API 服务配置
API_ENABLED: true
API_PORT: 8090  # 内部端口，Nginx 代理到 8089
API_HOST: "127.0.0.1"
API_CORS_ORIGINS: ["*"]
API_AUTH_TOKEN: ""

TEST_MODE: false
