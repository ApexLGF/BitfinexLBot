server {
    listen 80;
    server_name www.llamer.co;
    
    root /var/www/html;
    index index.html index.php;
    
    # 静态文件处理
    location / {
        try_files $uri $uri/ =404;
    }
    
    # Wetty Web界面路径代理
    location /wetty {
        proxy_pass http://wetty:3000/wetty;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Wetty静态资源代理
    location /wetty/ {
        proxy_pass http://wetty:3000/wetty/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BitfinexBot Web 界面路径 - 主要修复
    location /bitfinex/ {
        alias /var/www/bitfinex-bot/;
        index index.html index.htm index.php;
        try_files $uri $uri/ @bitfinex_fallback;
        
        # 处理BitfinexBot的PHP文件 - 关键修复
        location ~ \.php$ {
            fastcgi_pass php-fpm:9000;
            # 修复：移除 alias 路径前缀，使用正确的文件系统路径
            fastcgi_param SCRIPT_FILENAME /var/www/bitfinex-bot$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param DOCUMENT_ROOT /var/www/bitfinex-bot;
            include fastcgi_params;
        }
    }

    # BitfinexBot fallback
    location @bitfinex_fallback {
        rewrite ^/bitfinex/(.*)$ /bitfinex/index.html last;
    }
    
    # 通过 /php/ 访问 php 目录中的文件
    location ~ ^/php/(.+\.php)$ {
        alias /var/www/php/$1;
        fastcgi_pass php-fpm:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/php/$1;
        fastcgi_param DOCUMENT_ROOT /var/www/php;
    }
    
    # 原有应用的PHP文件处理
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php-fpm:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # 禁止访问敏感文件
    location ~ /\.(?!well-known).* {
        deny all;
    }
}