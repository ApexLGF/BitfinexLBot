server {
    listen 80;
    server_name www.llamer.co;
    
    root /var/www/html;
    index index.html index.php;
    
    # 静态文件处理
    location / {
        try_files $uri $uri/ =404;
    }
    
    # Wetty Web界面路径代理
    location /wetty {
        proxy_pass http://wetty:3000/wetty;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Wetty静态资源代理
    location /wetty/ {
        proxy_pass http://wetty:3000/wetty/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BitfinexBot Web 界面路径 - 修正版本
    location /bitfinex/ {
        alias /var/www/bitfinex-bot/;
        index index.html index.htm index.php;
        try_files $uri $uri/ @bitfinex_fallback;
    }
    
    # BitfinexBot API PHP文件处理 - 关键修复
    location ~ ^/bitfinex/api/(.+\.php)$ {
        # 检查文件是否存在
        try_files /dev/null @bitfinex_api_php;
    }
    
    # BitfinexBot API PHP处理器
    location @bitfinex_api_php {
        # 提取API路径和文件名
        if ($uri ~ ^/bitfinex/api/(.+\.php)$) {
            set $php_file $1;
        }
        
        fastcgi_pass php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/bitfinex-bot/api/$php_file;
        fastcgi_param SCRIPT_NAME /bitfinex/api/$php_file;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/bitfinex-bot;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param QUERY_STRING $query_string;
        include fastcgi_params;
    }
    
    # BitfinexBot 其他PHP文件处理
    location ~ ^/bitfinex/(.+\.php)$ {
        set $php_script $1;
        
        fastcgi_pass php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/bitfinex-bot/$php_script;
        fastcgi_param SCRIPT_NAME /bitfinex/$php_script;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/bitfinex-bot;
        include fastcgi_params;
    }

    # BitfinexBot fallback
    location @bitfinex_fallback {
        rewrite ^/bitfinex/(.*)$ /bitfinex/index.html last;
    }
    
    # 通过 /php/ 访问 php 目录中的文件
    location ~ ^/php/(.+\.php)$ {
        set $php_file $1;
        
        fastcgi_pass php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/php/$php_file;
        fastcgi_param SCRIPT_NAME /php/$php_file;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/php;
        include fastcgi_params;
    }
    
    # 原有应用的PHP文件处理（最后匹配，避免冲突）
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT $document_root;
        include fastcgi_params;
    }
    
    # 静态文件缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 安全头设置
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # 禁止访问敏感文件
    location ~ /\.(?!well-known).* {
        deny all;
    }
    
    location ~ ~$ {
        deny all;
    }
}