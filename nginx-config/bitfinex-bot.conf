# BitfinexBot Web 界面配置
server {
    listen 80;
    server_name localhost;
    
    # 原有应用的根路径
    location / {
        root /var/www/html;
        index index.html index.htm index.php;
        try_files $uri $uri/ =404;
    }

    # 原有PHP应用路径
    location /php/ {
        root /var/www;
        index index.php;
        try_files $uri $uri/ =404;
        
        location ~ \.php$ {
            fastcgi_pass php-fpm:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # BitfinexBot Web 界面路径
    location /bitfinex/ {
        alias /var/www/bitfinex-bot/;
        index index.html index.htm index.php;
        try_files $uri $uri/ @bitfinex_fallback;
        
        # 处理PHP文件
        location ~ \.php$ {
            fastcgi_pass php-fpm:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/bitfinex-bot$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # BitfinexBot fallback
    location @bitfinex_fallback {
        rewrite ^/bitfinex/(.*)$ /bitfinex/index.html last;
    }

    # 静态文件缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 安全头设置
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # 禁止访问敏感文件
    location ~ /\. {
        deny all;
    }
    
    location ~ ~$ {
        deny all;
    }
}