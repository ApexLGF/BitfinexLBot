<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitfinexBot 控制台</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 自定义样式 -->
    <link href="static/css/app.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-robot me-2"></i>BitfinexBot 控制台
            </a>
            
            <div class="navbar-nav ms-auto">
                <div class="nav-item me-3">
                    <button type="button" class="btn btn-outline-light btn-sm" id="refresh-btn" title="刷新所有数据">
                        <i class="bi bi-arrow-clockwise me-1"></i>刷新数据
                    </button>
                </div>
                <div class="nav-item">
                    <span class="navbar-text" id="status-indicator">
                        <i class="bi bi-circle-fill text-secondary me-1"></i>
                        <span id="bot-status">连接中...</span>
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        <div class="row">
            <!-- 控制面板 -->
            <div class="col-lg-8">
                <!-- 机器人状态卡片 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-speedometer2 me-2"></i>机器人状态
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3">
                                <div class="text-center">
                                    <div class="fs-1 mb-2">
                                        <i class="bi bi-robot" id="robot-icon"></i>
                                    </div>
                                    <div class="btn-group" role="group">
                                        <button type="button" class="btn btn-success" id="start-btn">
                                            <i class="bi bi-play-fill"></i> 启动
                                        </button>
                                        <button type="button" class="btn btn-warning" id="stop-btn">
                                            <i class="bi bi-stop-fill"></i> 停止
                                        </button>
                                        <button type="button" class="btn btn-info" id="restart-btn">
                                            <i class="bi bi-arrow-clockwise"></i> 重启
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-9">
                                <div class="row g-3">
                                    <div class="col-sm-6 col-md-3">
                                        <div class="card border-0 bg-light">
                                            <div class="card-body text-center">
                                                <i class="bi bi-wallet2 text-success fs-4"></i>
                                                <div class="mt-1">
                                                    <div class="fw-bold" id="available-funds">-</div>
                                                    <small class="text-muted">可用资金</small>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-sm-6 col-md-3">
                                        <div class="card border-0 bg-light">
                                            <div class="card-body text-center">
                                                <i class="bi bi-list-ul text-primary fs-4"></i>
                                                <div class="mt-1">
                                                    <div class="fw-bold" id="active-offers">-</div>
                                                    <small class="text-muted">贷出挂单</small>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-sm-6 col-md-3">
                                        <div class="card border-0 bg-light">
                                            <div class="card-body text-center">
                                                <i class="bi bi-graph-up text-info fs-4"></i>
                                                <div class="mt-1">
                                                    <div class="fw-bold" id="total-earnings">-</div>
                                                    <small class="text-muted">总收益</small>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-sm-6 col-md-3">
                                        <div class="card border-0 bg-light">
                                            <div class="card-body text-center">
                                                <i class="bi bi-clock text-warning fs-4"></i>
                                                <div class="mt-1">
                                                    <div class="fw-bold" id="next-run">-</div>
                                                    <small class="text-muted">下次运行</small>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 收益图表 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-graph-up me-2"></i>收益趋势
                        </h5>
                    </div>
                    <div class="card-body">
                        <canvas id="earnings-chart" height="300"></canvas>
                    </div>
                </div>

                <!-- 贷出挂单列表 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-list-ul me-2"></i>贷出挂单列表
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover" id="offers-table">
                                <thead>
                                    <tr>
                                        <th>订单ID</th>
                                        <th>金额</th>
                                        <th>利率</th>
                                        <th>期限</th>
                                        <th>状态</th>
                                        <th>创建时间</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td colspan="6" class="text-center text-muted">正在加载...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 已贷出订单列表 -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-check-circle me-2"></i>已贷出订单列表
                        </h5>
                        <div class="d-flex gap-3">
                            <span class="badge bg-primary">
                                <i class="bi bi-hash me-1"></i>数量: <span id="credits-count">-</span>
                            </span>
                            <span class="badge bg-success">
                                <i class="bi bi-currency-dollar me-1"></i>总额: <span id="credits-total">-</span>
                            </span>
                            <span class="badge bg-info">
                                <i class="bi bi-percent me-1"></i>平均利率: <span id="credits-avg-rate">-</span>%
                            </span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover" id="credits-table">
                                <thead>
                                    <tr>
                                        <th>订单ID</th>
                                        <th>金额</th>
                                        <th>利率</th>
                                        <th>期限</th>
                                        <th>状态</th>
                                        <th>创建时间</th>
                                        <th>生效时间</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td colspan="7" class="text-center text-muted">正在加载...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 侧边栏 -->
            <div class="col-lg-4">
                <!-- 快速统计 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-bar-chart me-2"></i>收益统计
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-12">
                                <div class="d-flex justify-content-between">
                                    <span>今日收益</span>
                                    <span class="fw-bold text-success" id="daily-earnings">-</span>
                                </div>
                                <hr>
                            </div>
                            <div class="col-12">
                                <div class="d-flex justify-content-between">
                                    <span>本周收益</span>
                                    <span class="fw-bold text-info" id="weekly-earnings">-</span>
                                </div>
                                <hr>
                            </div>
                            <div class="col-12">
                                <div class="d-flex justify-content-between">
                                    <span>本月收益</span>
                                    <span class="fw-bold text-primary" id="monthly-earnings">-</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 配置管理 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-gear me-2"></i>配置管理
                        </h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-outline-primary w-100 mb-2" data-bs-toggle="modal" data-bs-target="#config-modal">
                            <i class="bi bi-pencil-square me-2"></i>编辑配置
                        </button>
                        <button class="btn btn-outline-secondary w-100" id="refresh-config">
                            <i class="bi bi-arrow-clockwise me-2"></i>刷新配置
                        </button>
                    </div>
                </div>

                <!-- 系统日志 -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-terminal me-2"></i>系统日志
                        </h5>
                    </div>
                    <div class="card-body p-0">
                        <div id="log-container" style="height: 450px; overflow-y: auto; font-family: monospace; font-size: 0.875rem;">
                            <div class="p-3 text-muted">正在加载日志...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 配置编辑模态框 -->
    <div class="modal fade" id="config-modal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-gear me-2"></i>编辑配置
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="config-form">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">交易货币</label>
                                <select class="form-select" name="CURRENCY">
                                    <option value="USD">USD</option>
                                    <option value="BTC">BTC</option>
                                    <option value="ETH">ETH</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">运行间隔(分钟)</label>
                                <input type="number" class="form-control" name="MINUTES_RUN" min="1" max="60">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">最小放贷金额</label>
                                <input type="number" class="form-control" name="MIN_LOAN" step="0.01" min="0">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">最大放贷金额</label>
                                <input type="number" class="form-control" name="MAX_LOAN" step="0.01" min="0">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">最小日利率(%)</label>
                                <input type="number" class="form-control" name="MIN_DAILY_LEND_RATE" step="0.001" min="0">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">资金分散数</label>
                                <input type="number" class="form-control" name="SPREAD_LEND" min="1">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">高额持有利率(%)</label>
                                <input type="number" class="form-control" name="HIGH_HOLD_RATE" step="0.001" min="0">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">高额持有金额</label>
                                <input type="number" class="form-control" name="HIGH_HOLD_AMOUNT" step="0.01" min="0">
                            </div>
                            <div class="col-12">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="TEST_MODE" id="test-mode">
                                    <label class="form-check-label" for="test-mode">
                                        测试模式 (不执行真实交易)
                                    </label>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="save-config">保存配置</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 自定义脚本 -->
    <script src="static/js/api.js?v=7"></script>
    <script src="static/js/charts.js?v=7"></script>
    <script src="static/js/app.js?v=7"></script>
</body>
</html>
