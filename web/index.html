<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitfinexBot 控制台</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 自定义样式 -->
    <link href="static/css/app.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-robot me-2"></i>BitfinexBot 控制台 <small class="text-light opacity-75">v2.6.5</small>
            </a>

            <div class="navbar-nav ms-auto">
                <div class="nav-item">
                    <span class="navbar-text" id="status-indicator">
                        <i class="bi bi-circle-fill text-secondary me-1"></i>
                        <span id="bot-status">连接中...</span>
                        <small class="text-muted ms-2" id="connection-timestamp"></small>
                        <span id="loading-indicator" class="ms-2" style="display: none;">
                            <span class="spinner-border spinner-border-sm text-light" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </span>
                            <small class="text-light ms-1">刷新中</small>
                        </span>
                        <small class="text-muted ms-2" id="refresh-countdown" style="display: none;"></small>
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <!-- 系统日志（全宽） -->
    <div class="container-fluid px-3 mt-2">
        <div class="card">
            <div class="card-header py-2">
                <i class="bi bi-terminal me-2"></i>系统日志
            </div>
            <div class="card-body p-0">
                <div id="log-container" class="log-terminal">
                    <!-- 日志内容将通过 JavaScript 动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid mt-3">
        <div class="row">
            <!-- 左侧面板 (70%) -->
            <div class="col-lg-8 col-xl-9">
                <!-- 币种 TAB 导航 -->
                <ul class="nav nav-tabs currency-tabs mb-3" id="currency-tabs" role="tablist">
                    <!-- TAB 将通过 JavaScript 动态生成 -->
                </ul>

                <!-- TAB 内容区域 -->
                <div class="tab-content" id="currency-tab-content">
                    <!-- 每个币种的内容将通过 JavaScript 动态生成 -->
                </div>
            </div>

            <!-- 右侧面板 (30%) -->
            <div class="col-lg-4 col-xl-3">
                <!-- 整体放贷信息 -->
                <div class="card mb-3">
                    <div class="card-header">
                        <i class="bi bi-graph-up me-2"></i>整体放贷信息
                    </div>
                    <div class="card-body">
                        <h6 class="card-subtitle mb-2 text-muted">当前 FRR 利率</h6>
                        <div id="frr-rates-container" class="mb-3">
                            <div class="text-center text-muted py-2">
                                <span class="spinner-border spinner-border-sm me-2"></span>加载中...
                            </div>
                        </div>

                        <hr>

                        <h6 class="card-subtitle mb-2 text-muted">钱包总额</h6>
                        <div id="wallet-total-container" class="mb-3">
                            <div class="text-center text-muted py-2">
                                <span class="spinner-border spinner-border-sm me-2"></span>加载中...
                            </div>
                        </div>

                        <hr>

                        <h6 class="card-subtitle mb-2 text-muted">365日累计收益</h6>
                        <div id="yearly-earnings-container">
                            <div class="text-center text-muted py-2">
                                <span class="spinner-border spinner-border-sm me-2"></span>加载中...
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 配置管理 -->
                <div class="card">
                    <div class="card-header">
                        <i class="bi bi-gear me-2"></i>配置管理
                    </div>
                    <div class="card-body">
                        <!-- 币种最小利率显示 -->
                        <div id="min-rates-container" class="mb-3">
                            <!-- 将通过 JavaScript 动态生成 -->
                        </div>
                        <button class="btn btn-outline-secondary w-100" data-bs-toggle="modal" data-bs-target="#config-modal">
                            <i class="bi bi-pencil-square me-1"></i>编辑配置
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 配置编辑模态框 -->
    <div class="modal fade" id="config-modal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-gear me-2"></i>编辑配置
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="config-form">
                        <!-- 配置表单将通过 JavaScript 动态生成 -->
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="save-config">
                        <i class="bi bi-save me-1"></i>保存配置
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 贷出挂单详情模态框 -->
    <div class="modal fade" id="offers-detail-modal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-list-ul me-2"></i>贷出挂单详情
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="offers-detail-content">
                    <!-- 内容动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 已贷出订单详情模态框 -->
    <div class="modal fade" id="credits-detail-modal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-check-circle me-2"></i>已贷出订单详情
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="credits-detail-content">
                    <!-- 内容动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 应用脚本 -->
    <script src="static/js/api.js"></script>
    <script src="static/js/charts.js"></script>
    <script src="static/js/tabs.js"></script>
    <script src="static/js/dashboard.js"></script>
    <script src="static/js/overall-info.js"></script>
    <script src="static/js/config-manager.js"></script>
    <script src="static/js/app.js"></script>
</body>
</html>
